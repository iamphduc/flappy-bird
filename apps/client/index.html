<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <!-- Empty icon, so the browser does not ask for /favicon.ico. -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="layout">
      <div id="play" class="cabinet">
        <header class="marquee">
          <h1>Flappy Bird</h1>
        </header>
        <p id="player-bar" hidden>
          <span class="player-label">Playing as <strong id="player-name"></strong></span>
          <button type="button" id="change-name" class="key">Change</button>
        </p>
        <form id="rename-form" hidden>
          <label for="new-name">Name</label>
          <input id="new-name" name="nickname" maxlength="20" autocomplete="off" />
          <span class="rename-actions">
            <button type="submit" class="key">Save</button>
            <button type="button" id="reroll-name" class="key key-quiet">Random name</button>
            <button type="button" id="cancel-rename" class="key key-quiet">Cancel</button>
          </span>
          <span id="rename-error" role="alert"></span>
        </form>
        <div class="bezel">
          <canvas id="game" width="288" height="512" role="img" aria-label="Flappy Bird game"></canvas>
        </div>
        <div class="display">
          <p id="recording" aria-live="polite"></p>
          <p id="status">Checking server…</p>
        </div>
      </div>
      <aside id="panel">
        <section id="last-game" aria-live="polite">
          <h2>Last game</h2>
          <div id="last-game-body"></div>
        </section>
        <section id="my-stats" aria-live="polite">
          <h2>My stats</h2>
          <div id="my-stats-body"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
